  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0); z-index: 0; }
  .container { position: relative; z-index: 1; width: 100%; max-width: 480px; }

  h1 { text-align: center; font-size: 14px; font-weight: 900; margin-bottom: 16px; color: #4ab3f4; text-shadow: -2px 0 0 #000, 2px 0 0 #000, 0 -2px 0 #000, 0 2px 0 #000, -1px -2px 0 #000, 1px -2px 0 #000, -1px 2px 0 #000, 1px 2px 0 #000; }

  .tabs { display: flex; background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 10px; padding: 4px; margin-bottom: 14px; gap: 4px; align-items: center; }
  .tab-room-code { font-size: 16px; font-weight: 900; color: #ffffff; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, -2px 0 0 #000, 2px 0 0 #000, 0 -2px 0 #000, 0 2px 0 #000; padding: 4px 8px; white-space: nowrap; letter-spacing: 0.1em; display: none; }
  .tab-btn { flex: 1; padding: 8px; border: none; border-radius: 7px; background: transparent; color: #888; font-size: 12px; font-weight: 700; cursor: pointer; }
  .tab-btn.active { background: #333; color: #fff; }

  /* Лобби */
  #lobby { display: block; }
  .lobby-box { background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .lobby-box h3 { font-size: 13px; color: #4ab3f4; margin-bottom: 12px; letter-spacing: 0.05em; }
  .symbol-choose { display: flex; gap: 8px; margin-bottom: 12px; }
  .sym-btn { flex: 1; padding: 10px; border: 2px solid #333; border-radius: 8px; background: transparent; color: #888; font-size: 20px; cursor: pointer; transition: all 0.15s; }
  .sym-btn.active.x { border-color: #4ab3f4; color: #4ab3f4; background: rgba(74,179,244,0.1); }
  .sym-btn.active.o { border-color: #f4834a; color: #f4834a; background: rgba(244,131,74,0.1); }
  .input-row { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 9px 12px; background: rgba(0,0,0,0.5); border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 13px; outline: none; }
  input[type=text]:focus { border-color: #4ab3f4; }
  .btn-primary { padding: 9px 16px; background: #4ab3f4; border: none; border-radius: 8px; color: #000; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn-primary:hover { background: #6bc4f7; }
  .btn-secondary { padding: 9px 16px; background: transparent; border: 1px solid #444; border-radius: 8px; color: #888; font-size: 12px; font-weight: 700; cursor: pointer; }
  .btn-secondary:hover { border-color: #666; color: #fff; }
  .room-id-display { background: rgba(74,179,244,0.1); border: 1px solid #4ab3f4; border-radius: 8px; padding: 10px; text-align: center; margin-top: 10px; }
  .room-id-display .rid { font-size: 28px; font-weight: 900; color: #4ab3f4; letter-spacing: 0.2em; }
  .room-id-display small { font-size: 11px; color: #888; display: block; margin-bottom: 4px; }
  .waiting { text-align: center; color: #888; font-size: 12px; margin-top: 8px; animation: blink 1.2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Игра */
  #game { display: none; }
  .scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; margin-bottom: 12px; align-items: center; }
  .score-card { background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 10px; padding: 10px; text-align: center; }
  .score-card.x-card { border-top: 3px solid #4ab3f4; }
  .score-card.o-card { border-top: 3px solid #f4834a; }
  .score-card .label { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; margin-bottom: 3px; }
  .score-card.x-card .label { color: #4ab3f4; }
  .score-card.o-card .label { color: #f4834a; }
  .score-card .val { font-size: 26px; font-weight: 900; }
  .score-card.x-card .val { color: #4ab3f4; }
  .score-card.o-card .val { color: #f4834a; }
  .score-draw { text-align: center; }
  .score-draw span { font-size: 9px; color: #888; display: block; }
  .score-draw .val { font-size: 16px; font-weight: 700; color: #888; }

  .status-bar { text-align: center; margin-bottom: 8px; min-height: 24px; }
  .status-text { font-size: 13px; font-weight: 700; }
  .status-text.x { color: #4ab3f4; font-weight: 900; text-shadow: -1px 0 #000, 1px 0 #000, 0 -1px #000, 0 1px #000; }
  .status-text.my-turn { color: #4ab3f4 !important; font-size: 15px; font-weight: 900; text-shadow: -1px 0 #000, 1px 0 #000, 0 -1px #000, 0 1px #000; animation: pulse 1.2s infinite; }
  .status-text.opp-turn { color: #aaa !important; font-size: 13px; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
  .status-text.o { color: #f4834a; }
  .status-text.draw { color: #aaa; }
  .status-text.info { color: #888; }

  .board { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; margin-bottom: 10px; }
  .cell {
    aspect-ratio: 1; background: rgba(0,0,0,0.65); border: 1px solid #444;
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 14px; font-weight: 900;
    transition: transform 0.1s, border-color 0.15s; user-select: none;
  }
  .cell:hover:not(.taken):not(.disabled) { border-color: #666; transform: scale(1.06); }
  .cell.x { color: #4ab3f4; border-color: rgba(74,179,244,0.4); }
  .cell.o { color: #f4834a; border-color: rgba(244,131,74,0.4); }
  .cell.win.x { background: rgba(74,179,244,0.2); border-color: #4ab3f4; box-shadow: 0 0 10px rgba(74,179,244,0.4); }
  .cell.win.o { background: rgba(244,131,74,0.2); border-color: #f4834a; box-shadow: 0 0 10px rgba(244,131,74,0.4); }
  .cell.disabled { cursor: default; }

  .game-btns { display: flex; gap: 8px; }
  .btn-reset { flex: 1; padding: 11px; background: rgba(0,0,0,0.6); border: 1px solid #444; border-radius: 10px; color: #888; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; cursor: pointer; }
  .btn-reset:hover { border-color: #666; color: #fff; }
  .btn-draw { flex: 1; padding: 11px; background: rgba(0,0,0,0.6); border: 1px solid #f4834a; border-radius: 10px; color: #f4834a; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; cursor: pointer; }
  .btn-draw:hover { background: rgba(244,131,74,0.15); color: #fff; }
  .btn-draw.voted { background: rgba(244,131,74,0.25); color: #fff; border-color: #fff; }
  .draw-hint { text-align: center; font-size: 10px; color: #f4834a; margin-top: 6px; min-height: 14px; }

  /* Локальный режим */
  .difficulty { display: flex; gap: 6px; margin-bottom: 14px; justify-content: center; }
  .diff-btn { padding: 6px 12px; border: 1px solid #333; border-radius: 7px; background: rgba(0,0,0,0.5); color: #888; font-size: 11px; font-weight: 700; cursor: pointer; }
  .diff-btn.active { border-color: #4ab3f4; color: #4ab3f4; }
  .thinking { text-align: center; font-size: 11px; color: #aaa; margin-bottom: 6px; height: 16px; font-style: italic; }

  .mode-switch { display: flex; background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 10px; padding: 4px; margin-bottom: 14px; gap: 4px; }
  .mode-btn { flex: 1; padding: 8px; border: none; border-radius: 7px; background: transparent; color: #888; font-size: 12px; font-weight: 700; cursor: pointer; }
  .mode-btn.active { background: #333; color: #fff; }
</style>
</head>
<body>
<div class="overlay"></div>
<div class="container">
  <h1>Шашлык против Шашлычника</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('local')">🖥️ Локальная игра</button>
    <button class="tab-btn" onclick="switchTab('online')">🌐 Онлайн (2 игрока)</button>
    <span class="tab-room-code" id="tabRoomCode"></span>
  </div>

  <!-- ЛОКАЛЬНАЯ ИГРА -->
  <div id="localSection">
    <div class="mode-switch">
      <button class="mode-btn active" id="btn2p" onclick="setMode('2p')">👥 Два игрока</button>
      <button class="mode-btn" id="btnAI" onclick="setMode('ai')">🤖 Против компьютера</button>
    </div>
    <div class="difficulty" id="diffPanel" style="display:none">
      <button class="diff-btn active" id="d-easy" onclick="setDiff('easy')">ЛЕГКО</button>
      <button class="diff-btn" id="d-medium" onclick="setDiff('medium')">СРЕДНЕ</button>
      <button class="diff-btn" id="d-hard" onclick="setDiff('hard')">СЛОЖНО</button>
    </div>
    <div class="scoreboard">
      <div class="score-card x-card"><div class="label" id="labelX">ШАШЛЫЧНИК</div><div class="val" id="sx">0</div></div>
      <div class="score-draw"><span>НИЧЬЯ</span><div class="val" id="sd">0</div></div>
      <div class="score-card o-card"><div class="label" id="labelO">ШАШЛЫК</div><div class="val" id="so">0</div></div>

const SIZE=9, WIN=6;
function getWins(){
  const wins=[];
  const seq=Array.from({length:WIN},(_,k)=>k);
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
    const i=r*SIZE+c;
    if(c+WIN<=SIZE) wins.push(seq.map(k=>i+k));
    if(r+WIN<=SIZE) wins.push(seq.map(k=>i+k*SIZE));
    if(c+WIN<=SIZE&&r+WIN<=SIZE) wins.push(seq.map(k=>i+k*SIZE+k));
    if(c-WIN>=-1&&r+WIN<=SIZE) wins.push(seq.map(k=>i+k*SIZE-k));
  }
  return wins;
}

function checkWinLocal(){for(const line of WINS)if(board[line[0]]&&line.every(i=>board[i]===board[line[0]]))return line;return null;}

function moveLocal(i){
  if(over||board[i]||aiThinking)return;
  if(lmode==='ai'&&cur==='O')return;
  board[i]=cur;renderLocal();
  if(handleLocal())return;
  cur=cur==='X'?'O':'X';
  if(lmode==='ai'&&cur==='O'&&!over){
    aiThinking=true;document.getElementById('thinking').textContent='Компьютер думает...';
    setSt('Ход компьютера','o');renderLocal();
    setTimeout(()=>{
      board[aiMove()]='O';aiThinking=false;
      document.getElementById('thinking').textContent='';
      renderLocal();if(handleLocal())return;
      cur='X';setSt('Ваш ход','x');renderLocal();
    },400+Math.random()*400);
  } else if(lmode==='2p') setSt('Ход '+(cur==='X'?'Шашлычника':'Шашлыка'),cur.toLowerCase());
}

function handleLocal(){
  const w=checkWinLocal();
  if(w){
    over=true;score[cur]++;updScore();
    setSt(lmode==='ai'?(cur==='X'?'Вы победили! 🎉':'Компьютер победил! 🤖'):(cur==='X'?'Шашлычник победил! 🎉':'Шашлык победил! 🎉'),cur.toLowerCase());
    document.querySelectorAll('#board .cell').forEach((c,i)=>{if(w.includes(i))c.classList.add('win');});
    return true;
  }
  if(board.every(v=>v)){over=true;score.D++;updScore();setSt('Ничья!','draw');return true;}
  return false;
}

function updScore(){
  document.getElementById('sx').textContent=score.X;
  document.getElementById('so').textContent=score.O;
  document.getElementById('sd').textContent=score.D;
}

function aiMove(){if(diff==='easy')return aiEasy();return aiMedium();}
function aiEasy(){if(Math.random()<0.5){const e=board.map((v,i)=>v?-1:i).filter(i=>i>=0);return e[Math.floor(Math.random()*e.length)];}return aiMedium();}
function aiMedium(){
  const w=findW('O');if(w!==-1)return w;
  const b=findW('X');if(b!==-1)return b;
  const nb=getNB();if(nb.length>0)return nb[Math.floor(Math.random()*nb.length)];
  const e=board.map((v,i)=>v?-1:i).filter(i=>i>=0);return e[Math.floor(Math.random()*e.length)];
}
function findW(p){
  for(const line of WINS){const v=line.map(i=>board[i]);const m=v.filter(x=>x===p).length;const e=v.filter(x=>x==='').length;if(m===WIN-1&&e===1)return line[v.indexOf('')];}return -1;
}
function getNB(){
  const taken=new Set(board.map((v,i)=>v?i:-1).filter(i=>i>=0));const nb=new Set();
  taken.forEach(i=>{const r=Math.floor(i/SIZE),c=i%SIZE;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE){const ni=nr*SIZE+nc;if(!board[ni])nb.add(ni);}}});
  return[...nb];
}

// ===== ОНЛАЙН ИГРА =====
let mySymbol='X', roomCode='', roomRef=null, unsubscribe=null;
let oboard=Array(SIZE*SIZE).fill(''), oscore={X:0,O:0,D:0};

function randCode(){return Math.random().toString(36).substring(2,8).toUpperCase();}

window.selectCreateSym=function(s){
  mySymbol=s;
  document.getElementById('createSymX').classList.toggle('active',s==='X');
  document.getElementById('createSymX').classList.toggle('x',s==='X');
  document.getElementById('createSymO').classList.toggle('active',s==='O');
  document.getElementById('createSymO').classList.toggle('o',s==='O');
};

window.createRoom=async function(){
  roomCode=randCode();
  const rref=ref(db,'rooms/'+roomCode);
  await set(rref,{
    board: Array(SIZE*SIZE).fill(''),
    cur: 'X',
    over: false,
    hostSymbol: mySymbol,
    score: {X:0,O:0,D:0},
    restart: false
  });
  document.getElementById('roomCodeDisplay').textContent=roomCode;
  document.getElementById('roomCreated').style.display='block';
  document.getElementById('tabRoomCode').textContent='🔑 '+roomCode;
  document.getElementById('tabRoomCode').style.display='block';
  listenRoom(roomCode, true);
};

window.joinRoom=async function(){
  const code=document.getElementById('joinCodeInput').value.trim().toUpperCase();
  if(!code){showJoinErr('Введи код комнаты');return;}
  const rref=ref(db,'rooms/'+code);
  const snap=await get(rref);
  if(!snap.exists()){showJoinErr('Комната не найдена');return;}
  const data=snap.val();
  if(data.guest){showJoinErr('Комната уже занята');return;}
  mySymbol=data.hostSymbol==='X'?'O':'X';
  roomCode=code;
  await update(rref,{guest:true});
  listenRoom(code, false);
};

function showJoinErr(msg){
  const el=document.getElementById('joinError');el.textContent=msg;el.style.display='block';
  setTimeout(()=>el.style.display='none',3000);
}

function listenRoom(code, isHost){
  roomRef=ref(db,'rooms/'+code);
  document.getElementById('lobby').style.display='none';
  document.getElementById('game').style.display='block';
  document.getElementById('roomCodeGame').textContent=code;

  if(unsubscribe) unsubscribe();
  unsubscribe=onValue(roomRef,(snap)=>{
    if(!snap.exists()){leaveRoom();return;}
    const d=snap.val();
    oboard=[...d.board];
    oscore=d.score||{X:0,O:0,D:0};
    renderOnline(d);
  });
}

function renderOnline(d){
  // счёт
  document.getElementById('osx').textContent=oscore.X||0;
  document.getElementById('oso').textContent=oscore.O||0;
  document.getElementById('osd').textContent=oscore.D||0;

  // статус
  const ostEl=document.getElementById('ostatus');
  if(!d.guest){
    ostEl.textContent='Ожидаем второго игрока...';ostEl.className='status-text info';
  } else if(d.over){
    if(d.winner){
      const iwin=d.winner===mySymbol;
      ostEl.textContent=iwin?'Вы победили! 🎉':'Противник победил!';
      ostEl.className='status-text '+(iwin?mySymbol.toLowerCase():(mySymbol==='X'?'o':'x'));
    } else {
      ostEl.textContent='Ничья!';ostEl.className='status-text draw';
    }
  } else {
    const myTurn=d.cur===mySymbol;
    ostEl.textContent=myTurn?'Ваш ход ('+(mySymbol==='X'?'Шашлычник':'Шашлык')+')':'Ход '+(mySymbol==='X'?'Шашлыка':'Шашлычника')+'...';
    ostEl.className='status-text '+(myTurn?mySymbol.toLowerCase():(mySymbol==='X'?'o':'x'));
  }

  // доска
  const el=document.getElementById('oboard');el.innerHTML='';
  const myTurn=d.cur===mySymbol&&!d.over&&d.guest;
  oboard.forEach((v,i)=>{

  // подсветка победной линии
  if(d.winLine){
    const cells=el.querySelectorAll('.cell');
    d.winLine.forEach(i=>cells[i].classList.add('win'));
  }

  // рестарт
  if(d.restart&&d.restartReady===2){
    update(roomRef,{board:Array(SIZE*SIZE).fill(''),cur:'X',over:false,winner:null,winLine:null,restart:false,restartReady:0,drawHost:false,drawGuest:false});
  }

  // Проверка ничьей по соглашению
  if(d.drawHost&&d.drawGuest&&!d.over){
    const newScore={...oscore};newScore.D=(newScore.D||0)+1;
    update(roomRef,{over:true,winner:null,winLine:null,drawAgreed:true,score:newScore});
  }

  // Обновить кнопку ничьей
  const drawBtn=document.getElementById('drawBtn');
  const drawHint=document.getElementById('drawHint');
  if(drawBtn){
    const myKey=d.hostSymbol===mySymbol?'drawHost':'drawGuest';
    const oppKey=myKey==='drawHost'?'drawGuest':'drawHost';
    if(d[myKey]) drawBtn.classList.add('voted');
    else drawBtn.classList.remove('voted');
    if(d[myKey]&&!d[oppKey]) drawHint.textContent='Ожидаем подтверждения противника...';
    else if(!d[myKey]&&d[oppKey]) drawHint.textContent='Противник предлагает ничью!';
    else drawHint.textContent='';
  }
}

async function makeOnlineMove(i,d){
  if(d.over||oboard[i]||d.cur!==mySymbol)return;
  const nb=[...oboard];nb[i]=mySymbol;
  const w=checkWinArr(nb);
  const full=nb.every(v=>v);
  const newScore={...oscore};
  let winner=null,winLine=null,over=false;
  if(w){over=true;winner=mySymbol;winLine=w;newScore[mySymbol]=(newScore[mySymbol]||0)+1;}
  else if(full){over=true;newScore.D=(newScore.D||0)+1;}
  await update(roomRef,{board:nb,cur:mySymbol==='X'?'O':'X',over,winner,winLine,score:newScore});
}

function checkWinArr(b){
  for(const line of WINS)if(b[line[0]]&&line.every(i=>b[i]===b[line[0]]))return line;
  return null;
}

window.requestRestart=async function(){
  if(!roomRef)return;
  const snap=await get(roomRef);
  if(!snap.exists())return;
  const d=snap.val();
  const ready=(d.restartReady||0)+1;
  await update(roomRef,{restart:true,restartReady:ready});
};

window.leaveRoom=async function(){
  if(unsubscribe){unsubscribe();unsubscribe=null;}
  if(roomRef) await remove(roomRef);
  roomRef=null;roomCode='';
  document.getElementById('lobby').style.display='block';
  document.getElementById('game').style.display='none';
  document.getElementById('tabRoomCode').style.display='none';
  document.getElementById('tabRoomCode').textContent='';
  document.getElementById('roomCreated').style.display='none';
  document.getElementById('joinCodeInput').value='';
};

// инициализация
initLocal();
