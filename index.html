<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Крестики-нолики</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --surface: #17171a;
    --border: #2a2a30;
    --x-color: #e8f4fd;
    --x-accent: #4ab3f4;
    --o-color: #fdeee8;
    --o-accent: #f4834a;
    --text: #f0f0f0;
    --muted: #888;
    --win-glow: #4ab3f4;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 20%, rgba(74,179,244,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(244,131,74,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
  }

  h1 {
    font-family: 'Unbounded', sans-serif;
    font-size: clamp(1.4rem, 5vw, 2rem);
    font-weight: 900;
    text-align: center;
    letter-spacing: -0.02em;
    margin-bottom: 2rem;
    background: linear-gradient(135deg, var(--x-accent) 0%, var(--o-accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .scoreboard {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8px;
    margin-bottom: 1.5rem;
    align-items: center;
  }

  .score-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }

  .score-card.x-card { border-top: 3px solid var(--x-accent); }
  .score-card.o-card { border-top: 3px solid var(--o-accent); }

  .score-card .label {
    font-family: 'Unbounded', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .score-card.x-card .label { color: var(--x-accent); }
  .score-card.o-card .label { color: var(--o-accent); }

  .score-card .val {
    font-family: 'Unbounded', sans-serif;
    font-size: 2rem;
    font-weight: 900;
    line-height: 1;
  }

  .score-card.x-card .val { color: var(--x-accent); }
  .score-card.o-card .val { color: var(--o-accent); }

  .score-draw {
    text-align: center;
  }

  .score-draw .label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
    display: block;
    margin-bottom: 2px;
  }

  .score-draw .val {
    font-family: 'Unbounded', sans-serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--muted);
  }

  .status-bar {
    text-align: center;
    margin-bottom: 1.2rem;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .status-text {
    font-family: 'Unbounded', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    transition: all 0.2s;
  }

  .status-text.x { color: var(--x-accent); }
  .status-text.o { color: var(--o-accent); }
  .status-text.draw { color: var(--muted); }
  .status-text.win { animation: pulse 0.6s ease-in-out; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 1.2rem;
  }

  .cell {
    aspect-ratio: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: 'Unbounded', sans-serif;
    font-size: clamp(2rem, 8vw, 2.8rem);
    font-weight: 900;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    position: relative;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .cell:hover:not(.taken) {
    border-color: #444;
    background: #1d1d22;
    transform: scale(1.03);
  }

  .cell:active:not(.taken) {
    transform: scale(0.97);
  }

  .cell.x {
    color: var(--x-accent);
    border-color: rgba(74,179,244,0.3);
    animation: popIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .cell.o {
    color: var(--o-accent);
    border-color: rgba(244,131,74,0.3);
    animation: popIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .cell.win {
    background: rgba(74,179,244,0.08);
    border-color: var(--x-accent);
    box-shadow: 0 0 20px rgba(74,179,244,0.2);
    animation: winGlow 0.4s ease;
  }

  .cell.win.o {
    background: rgba(244,131,74,0.08);
    border-color: var(--o-accent);
    box-shadow: 0 0 20px rgba(244,131,74,0.2);
  }

  @keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes winGlow {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  .btn-reset {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--muted);
    font-family: 'Unbounded', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-reset:hover {
    border-color: #555;
    color: var(--text);
    background: var(--surface);
  }

  .btn-reset:active {
    transform: scale(0.98);
  }
</style>
</head>
<body>
<div class="container">
  <h1>Крестики-нолики</h1>

  <div class="scoreboard">
    <div class="score-card x-card">
      <div class="label">ИГРОК X</div>
      <div class="val" id="sx">0</div>
    </div>
    <div class="score-draw">
      <span class="label">НИЧЬЯ</span>
      <div class="val" id="sd">0</div>
    </div>
    <div class="score-card o-card">
      <div class="label">ИГРОК O</div>
      <div class="val" id="so">0</div>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-text x" id="status">Ход игрока X</div>
  </div>

  <div class="board" id="board"></div>

  <button class="btn-reset" id="reset">НОВАЯ ИГРА</button>
</div>

<script>
  const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let board, cur, over, score = {X:0, O:0, D:0};

  function init() {
    board = Array(9).fill('');
    cur = 'X';
    over = false;
    setStatus('Ход игрока X', 'x');
    render();
  }

  function setStatus(text, cls) {
    const el = document.getElementById('status');
    el.textContent = text;
    el.className = 'status-text ' + cls;
  }

  function render() {
    const el = document.getElementById('board');
    el.innerHTML = '';
    board.forEach((v, i) => {
      const c = document.createElement('div');
      c.className = 'cell' + (v ? ' taken ' + v.toLowerCase() : '');
      c.textContent = v;
      c.addEventListener('click', () => move(i));
      el.appendChild(c);
    });
  }

  function checkWin() {
    for (const [a,b,c] of WINS) {
      if (board[a] && board[a]===board[b] && board[b]===board[c]) return [a,b,c];
    }
    return null;
  }

  function move(i) {
    if (over || board[i]) return;
    board[i] = cur;
    render();
    const w = checkWin();
    if (w) {
      over = true;
      score[cur]++;
      updateScore();
      setStatus(cur + ' победил! 🎉', cur.toLowerCase() + ' win');
      const cells = document.querySelectorAll('.cell');
      w.forEach(idx => cells[idx].classList.add('win'));
    } else if (board.every(v => v)) {
      over = true;
      score.D++;
      updateScore();
      setStatus('Ничья!', 'draw');
    } else {
      cur = cur === 'X' ? 'O' : 'X';
      setStatus('Ход игрока ' + cur, cur.toLowerCase());
    }
  }

  function updateScore() {
    document.getElementById('sx').textContent = score.X;
    document.getElementById('so').textContent = score.O;
    document.getElementById('sd').textContent = score.D;
  }

  document.getElementById('reset').addEventListener('click', init);
  init();
</script>
</body>
</html>
